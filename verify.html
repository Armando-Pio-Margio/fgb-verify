<!DOCTYPE html>
<html lang="it" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Tessera - Fuori Giri Bikers (FGB)</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            border: 3px solid #22c55e;
            border-radius: 12px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { color: #22c55e; margin-top: 0; font-size: 22px; }
        .status-valid { color: #22c55e; font-weight: bold; font-size: 18px; margin: 15px 0; }
        .status-invalid { color: #ef4444; font-weight: bold; font-size: 18px; margin: 15px 0; }
        .info { text-align: left; margin-top: 20px; font-size: 15px; line-height: 1.6; }
        .info span { color: #a1a1aa; }
    </style>
</head>
<body>

    <div class="card">
        <h2>FUORI GIRI BIKERS</h2>
        <div id="result">Verifica in corso...</div>
    </div>

    <script>
        const membriDB = {
            "FGB-2026-001": { nome: "Armando Pio Margio", nickname: "Admin", stagione: "2026" },
            "FGB-2026-002": { nome: "Antonia Antignano", nickname: "Antonia", stagione: "2026" },
            "FGB-2026-003": { nome: "Vincenzo D'Antonio", nickname: "Vinz TRK", stagione: "2026" },
            "FGB-2026-004": { nome: "Maria Varriale", nickname: "Maria", stagione: "2026" },
            "FGB-2026-005": { nome: "Mariapia D'Ambrosio", nickname: "Mariapia", stagione: "2026" },
            "FGB-2026-006": { nome: "Salvatore Basile", nickname: "Salvatore", stagione: "2026" },
            "FGB-2026-007": { nome: "Santo Angelino", nickname: "Santo", stagione: "2026" },
            "FGB-2026-008": { nome: "Salvatore Picone", nickname: "Salvo 457", stagione: "2026" },
            "FGB-2026-009": { nome: "Vincenzo Avemaria", nickname: "Vincenzo", stagione: "2026" },
            "FGB-2026-010": { nome: "Michela Panico", nickname: "Michela", stagione: "2026" },
            "FGB-2026-011": { nome: "Lorenzo Raitante", nickname: "Panigale V4", stagione: "2026" },
            "FGB-2026-012": { nome: "Antony Lingria", nickname: "Antony Hornet", stagione: "2026" },
            "FGB-2026-013": { nome: "Davide Marotta", nickname: "Davide", stagione: "2026" },
            "FGB-2026-014": { nome: "Domenico Ferone", nickname: "Domenico MT-09", stagione: "2026" },
            "FGB-2026-015": { nome: "Pierluigi Del Bono", nickname: "Pierluigi", stagione: "2026" },
            "FGB-2026-016": { nome: "Samuele Arabia", nickname: "Samu FGB", stagione: "2026" },
            "FGB-2026-017": { nome: "Domenico Citarelli", nickname: "Domenico", stagione: "2026" }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const idTessera = urlParams.get('id');
        const resultDiv = document.getElementById('result');

        if (idTessera && membriDB[idTessera]) {
            const m = membriDB[idTessera];
            resultDiv.innerHTML = `
                <div class="status-valid">✔ TESSERA VALIDA</div>
                <div class="info">
                    <p><span>Tesserato:</span><br><strong>${m.nome}</strong></p>
                    <p><span>Nickname:</span><br><strong>${m.nickname}</strong></p>
                    <p><span>ID Tessera:</span><br><strong>${idTessera}</strong></p>
                    <p><span>Stagione:</span><br><strong>${m.stagione}</strong></p>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="status-invalid">✖ TESSERA NON VALIDA</div>
                <p style="color: #a1a1aa; font-size: 14px;">Il codice tessera fornito non esiste o non è registrato nel sistema ufficiale FGB.</p>
            `;
        }
    </script>
</body>
</html>
